<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AXE · 1x Deposit</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        :root {
            --bg-void: #05010F;
            --bg-deep: #150A30;
            --card-dark: #170A38;
            --card-darker: #0E0524;
            --neon-purple: #A855F7;
            --accent-cyan: #22D3EE;
            --accent-blue: #3B82F6;
            --text-soft: #C9B8F0;
            --text-dim: #8A79B8;
            --danger-red: #E0224E;
            --success-green: #4ade80;
            --gold: #D4AF37;
            --glow-effect: 0 0 20px rgba(168, 85, 247, 0.5);
            --glow-cyan: 0 0 20px rgba(34, 211, 238, 0.45);
            --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            --shadow-sm: 0 4px 10px rgba(0, 0, 0, 0.5);
            --shadow-md: 0 8px 20px rgba(0, 0, 0, 0.6);
            --shadow-lg: 0 15px 30px rgba(0, 0, 0, 0.7);
            --border-radius: 16px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Montserrat', sans-serif;
            background: radial-gradient(circle at 20% 0%, var(--bg-deep), var(--bg-void) 60%);
            color: var(--text-soft);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 16px 40px;
            background-attachment: fixed;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(ellipse at 30% 40%, rgba(34, 211, 238, 0.03) 0%, transparent 50%),
                        radial-gradient(ellipse at 70% 60%, rgba(124, 58, 237, 0.03) 0%, transparent 50%);
            z-index: 0;
            pointer-events: none;
        }

        .container {
            max-width: 600px;
            width: 100%;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        /* ===== HEADER ===== */
        .brand {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 12px 0 20px;
            border-bottom: 1px solid rgba(168, 85, 247, 0.4);
            margin-bottom: 28px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .brand-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .brand-avatar {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: var(--text-soft);
            border: 2px solid var(--neon-purple);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow: 0 0 16px rgba(168, 85, 247, 0.4);
            font-family: 'Cinzel', serif;
        }

        .brand-avatar img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        .brand-name {
            font-family: 'Cinzel', serif;
            font-weight: 700;
            font-size: 1.5rem;
            letter-spacing: 2px;
            background: linear-gradient(90deg, var(--neon-purple), var(--accent-cyan));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        /* ===== HAMBURGER MENU ===== */
        .menu-toggle {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 30px;
            height: 24px;
            cursor: pointer;
            transition: 0.3s;
            z-index: 110;
            position: relative;
        }
        .menu-toggle span {
            display: block;
            height: 3px;
            width: 100%;
            background: var(--accent-cyan);
            border-radius: 4px;
            transition: 0.3s;
            transform-origin: center;
        }
        .menu-toggle:hover span {
            background: var(--text-soft);
        }
        .menu-toggle.active span:nth-child(1) {
            transform: rotate(45deg) translate(5px, 5px);
        }
        .menu-toggle.active span:nth-child(2) {
            opacity: 0;
        }
        .menu-toggle.active span:nth-child(3) {
            transform: rotate(-45deg) translate(5px, -5px);
        }

        .dropdown-menu {
            position: fixed;
            top: 0;
            right: -100%;
            width: 280px;
            height: 100vh;
            background: rgba(14, 5, 36, 0.98);
            padding: 80px 30px 30px;
            transition: 0.3s ease;
            z-index: 105;
            box-shadow: var(--shadow-lg);
            backdrop-filter: blur(10px);
            border-left: 1px solid rgba(168, 85, 247, 0.4);
        }
        .dropdown-menu.active {
            right: 0;
        }
        .dropdown-menu a {
            display: block;
            color: var(--neon-purple);
            text-decoration: none;
            padding: 12px 15px;
            margin: 10px 0;
            border-radius: 8px;
            font-weight: 600;
            transition: 0.3s;
            background: rgba(168, 85, 247, 0.08);
            border-left: 3px solid transparent;
            font-family: 'Cinzel', serif;
            letter-spacing: 1px;
        }
        .dropdown-menu a:hover {
            background: rgba(34, 211, 238, 0.15);
            transform: translateX(-5px);
            border-left: 3px solid var(--accent-cyan);
            color: var(--accent-cyan);
        }

        /* ===== MAIN CARD ===== */
        .main-card {
            background: linear-gradient(160deg, var(--card-dark), var(--card-darker));
            border: 1px solid rgba(168, 85, 247, 0.35);
            border-radius: var(--border-radius);
            padding: 30px 28px;
            box-shadow: var(--shadow-md);
            backdrop-filter: blur(10px);
            text-align: center;
        }

        .main-title {
            font-family: 'Cinzel', serif;
            font-size: 2.2rem;
            background: linear-gradient(90deg, var(--neon-purple), var(--accent-cyan));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 2px;
        }

        .main-subtitle {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.85rem;
            color: var(--text-dim);
            letter-spacing: 2px;
            margin-bottom: 25px;
        }

        /* ===== INPUTS ===== */
        .input {
            width: 100%;
            max-width: 400px;
            padding: 14px 20px;
            background: rgba(168, 85, 247, 0.08);
            border: 2px solid rgba(168, 85, 247, 0.2);
            border-radius: 30px;
            font-size: 1rem;
            color: var(--text-soft);
            text-align: center;
            margin-bottom: 14px;
            outline: none;
            transition: all 0.3s ease;
            font-family: 'Montserrat', sans-serif;
            letter-spacing: 1px;
        }

        .input::placeholder {
            color: var(--text-dim);
            letter-spacing: 1px;
            font-size: 0.9rem;
        }

        .input:focus {
            background: rgba(168, 85, 247, 0.15);
            border-color: var(--accent-cyan);
            box-shadow: 0 0 0 3px rgba(34, 211, 238, 0.15);
        }

        /* ===== PAYMENT SECTION ===== */
        .payment-section {
            width: 100%;
            max-width: 400px;
            margin: 10px auto 12px;
            text-align: center;
        }

        .payment-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.75rem;
            color: var(--text-dim);
            letter-spacing: 2px;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .payment-options {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .payment-option {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 24px;
            background: rgba(168, 85, 247, 0.08);
            border: 2px solid rgba(168, 85, 247, 0.2);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.9rem;
            color: var(--text-soft);
            min-width: 120px;
            justify-content: center;
        }

        .payment-option:hover {
            background: rgba(168, 85, 247, 0.15);
            border-color: var(--accent-cyan);
            transform: translateY(-2px);
        }

        .payment-option.selected {
            border-color: var(--accent-cyan);
            background: rgba(34, 211, 238, 0.15);
            box-shadow: var(--glow-cyan);
        }

        .payment-option img {
            height: 28px;
            width: auto;
            object-fit: contain;
            border-radius: 4px;
        }

        .payment-option .option-label {
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        /* ===== DEPOSIT SUMMARY ===== */
        .summary-box {
            background: rgba(168, 85, 247, 0.06);
            border: 1px solid rgba(168, 85, 247, 0.15);
            border-radius: 12px;
            padding: 0;
            margin: 12px auto 18px;
            max-width: 400px;
            width: 100%;
            overflow: hidden;
            transition: all 0.3s ease;
            max-height: 0;
            opacity: 0;
        }

        .summary-box.visible {
            padding: 18px 20px;
            max-height: 300px;
            opacity: 1;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            border-bottom: 1px solid rgba(168, 85, 247, 0.08);
        }

        .summary-row:last-child {
            border-bottom: none;
            border-top: 2px solid rgba(168, 85, 247, 0.2);
            padding-top: 10px;
            margin-top: 4px;
            font-weight: 700;
            font-size: 1.1rem;
        }

        .summary-row .label {
            color: var(--text-dim);
            font-size: 0.85rem;
        }

        .summary-row .value {
            color: var(--success-green);
            font-weight: 600;
            font-size: 0.95rem;
            text-shadow: 0 0 10px rgba(74, 222, 128, 0.15);
        }

        .summary-row:last-child .value {
            color: var(--success-green);
            font-size: 1.15rem;
            text-shadow: 0 0 20px rgba(74, 222, 128, 0.2);
        }

        /* ===== BUTTON ===== */
        .btn {
            padding: 14px 50px;
            background: linear-gradient(135deg, var(--neon-purple), var(--accent-blue));
            color: #fff;
            border: none;
            border-radius: 30px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(168, 85, 247, 0.35);
            letter-spacing: 1px;
            font-family: 'Cinzel', serif;
            margin-top: 5px;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: var(--glow-cyan);
            color: var(--text-soft);
            background: linear-gradient(135deg, var(--accent-cyan), var(--neon-purple));
        }

        /* ===== BACK LINK ===== */
        .back-link {
            display: inline-block;
            margin-top: 18px;
            padding: 10px 25px;
            background: transparent;
            border: 1px solid rgba(168, 85, 247, 0.2);
            border-radius: 30px;
            color: var(--text-dim);
            font-family: 'Montserrat', sans-serif;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            letter-spacing: 1px;
        }

        .back-link:hover {
            border-color: var(--accent-cyan);
            color: var(--accent-cyan);
        }

        /* ===== ORNAMENTS ===== */
        .ornament {
            position: fixed;
            pointer-events: none;
            z-index: 0;
            opacity: 0.04;
            font-size: 100px;
            color: var(--neon-purple);
        }
        .ornament-1 { top: 50px; left: 50px; transform: rotate(15deg); }
        .ornament-2 { bottom: 50px; right: 50px; transform: rotate(-15deg); }

        /* ===== FOOTER ===== */
        .footer-note {
            margin-top: 30px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.7rem;
            color: var(--text-dim);
            letter-spacing: 1px;
            border-top: 1px solid rgba(168, 85, 247, 0.1);
            padding-top: 20px;
            text-align: center;
            width: 100%;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 600px) {
            .main-title {
                font-size: 1.8rem;
            }
            .main-card {
                padding: 20px 16px;
            }
            .payment-options {
                gap: 12px;
            }
            .payment-option {
                padding: 10px 16px;
                font-size: 0.8rem;
                min-width: 100px;
            }
            .summary-box.visible {
                padding: 14px 16px;
            }
        }

        @media (max-width: 400px) {
            .payment-options {
                flex-direction: column;
                align-items: center;
            }
            .payment-option {
                width: 100%;
                max-width: 200px;
            }
            .brand-name {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <div class="ornament ornament-1">❖</div>
    <div class="ornament ornament-2">❖</div>

    <div class="container">

        <!-- ===== HEADER ===== -->
        <div class="brand">
            <div class="brand-left">
                <div class="brand-avatar">
                    <img src="logo.png" alt="AX">
                </div>
                <div class="brand-name">AXE</div>
            </div>
            <div class="menu-toggle" id="menuToggle">
                <span></span><span></span><span></span>
            </div>
        </div>

        <!-- ===== DROPDOWN MENU ===== -->
        <div class="dropdown-menu" id="dropdownMenu">
            <a href="index.html"><i class="fas fa-home"></i> Home</a>
            <a href="about.html"><i class="fas fa-scroll"></i> About Us</a>
            <a href="contact-info.html"><i class="fas fa-envelope"></i> Contact</a>
            <a href="history.html"><i class="fas fa-clock"></i> History</a>
        </div>

        <!-- ===== MAIN CARD ===== -->
        <div class="main-card">
            <h1 class="main-title"> 1x Deposit</h1>
            <p class="main-subtitle">ADD FUNDS TO YOUR ACCOUNT</p>

            <input type="number" class="input" id="amountInput" placeholder="Enter Amount (e.g., 1000)" oninput="updateSummary()" />
            <input type="text" class="input" id="userId" placeholder="Enter Your 1xBet ID" />

            <div class="payment-section">
                <div class="payment-title">Select Payment Method</div>
                <div class="payment-options">
                    <div class="payment-option" data-method="esewa" data-charge="10" onclick="selectPayment('esewa')">
                        <img src="esewa-logo.JPG" alt="eSewa">
                        <span class="option-label">eSewa</span>
                    </div>
                    <div class="payment-option" data-method="bank" data-charge="15" onclick="selectPayment('bank')">
                        <img src="bank-logo.JPG" alt="Bank">
                        <span class="option-label">Bank</span>
                    </div>
                </div>
            </div>

            <!-- ===== DEPOSIT SUMMARY ===== -->
            <div class="summary-box" id="summaryBox">
                <div class="summary-row">
                    <span class="label">Depo Amount</span>
                    <span class="value" id="summaryAmount">₹0.00</span>
                </div>
                <div class="summary-row">
                    <span class="label">Charge</span>
                    <span class="value" id="summaryCharge">₹0.00</span>
                </div>
                <div class="summary-row">
                    <span class="label">Total</span>
                    <span class="value" id="summaryTotal">₹0.00</span>
                </div>
            </div>

            <button class="btn" onclick="proceedToPayment()">PAY NOW</button>

            <a href="1x-choose.html" class="back-link">← BACK</a>
        </div>

        <!-- ===== FOOTER ===== -->
        <div class="footer-note">
            <strong style="color: rgba(168, 85, 247, 0.4);">⚡ AXE</strong> · Premium gaming services
        </div>
    </div>

    <script>
        let selectedPayment = '';
        let selectedCharge = 10;

        // ===== MENU TOGGLE =====
        const menuToggle = document.getElementById('menuToggle');
        const dropdownMenu = document.getElementById('dropdownMenu');

        menuToggle.addEventListener('click', function(e) {
            e.stopPropagation();
            this.classList.toggle('active');
            dropdownMenu.classList.toggle('active');
        });

        document.addEventListener('click', function(event) {
            if (!event.target.closest('.menu-toggle') && !event.target.closest('.dropdown-menu')) {
                menuToggle.classList.remove('active');
                dropdownMenu.classList.remove('active');
            }
        });

        // ===== UPDATE SUMMARY =====
        function updateSummary() {
            const amountInput = document.getElementById('amountInput');
            const summaryBox = document.getElementById('summaryBox');
            const summaryAmount = document.getElementById('summaryAmount');
            const summaryCharge = document.getElementById('summaryCharge');
            const summaryTotal = document.getElementById('summaryTotal');

            const amount = parseFloat(amountInput.value) || 0;

            if (amount > 0 && selectedPayment) {
                summaryBox.classList.add('visible');
                const charge = selectedCharge;
                const total = amount + charge;
                summaryAmount.textContent = `₹${amount.toFixed(2)}`;
                summaryCharge.textContent = `₹${charge.toFixed(2)}`;
                summaryTotal.textContent = `₹${total.toFixed(2)}`;
            } else if (amount > 0 && !selectedPayment) {
                summaryBox.classList.add('visible');
                summaryAmount.textContent = `₹${amount.toFixed(2)}`;
                summaryCharge.textContent = `₹0.00`;
                summaryTotal.textContent = `₹${amount.toFixed(2)}`;
            } else {
                summaryBox.classList.remove('visible');
            }
        }

        // ===== PAYMENT SELECTION =====
        function selectPayment(method) {
            const options = document.querySelectorAll('.payment-option');
            options.forEach(opt => opt.classList.remove('selected'));

            const selected = document.querySelector(`.payment-option[data-method="${method}"]`);
            if (selected) {
                selected.classList.add('selected');
                selectedPayment = method;
                selectedCharge = parseInt(selected.dataset.charge) || 10;
            }
            updateSummary();
        }

        // ===== PROCEED TO PAYMENT =====
        function proceedToPayment() {
            const amount = document.getElementById('amountInput').value.trim();
            const userId = document.getElementById('userId').value.trim();

            if (!amount || parseFloat(amount) <= 0) {
                alert("Please enter a valid amount.");
                return;
            }
            if (!userId) {
                alert("Please enter your 1xBet ID.");
                return;
            }
            if (!selectedPayment) {
                alert("Please select a payment method.");
                return;
            }

            const charge = selectedCharge;
            const total = parseFloat(amount) + charge;

            // Save to localStorage
            localStorage.setItem('uid', userId);
            localStorage.setItem('package', `1xBet Deposit - ₹${amount}`);
            localStorage.setItem('packagePrice', total.toString());
            localStorage.setItem('serviceType', '1xBet Deposit');
            localStorage.setItem('paymentMethod', selectedPayment);
            localStorage.setItem('1xAmount', amount);
            localStorage.setItem('1xUserId', userId);
            localStorage.setItem('1xCharge', charge);
            localStorage.setItem('1xTotal', total);

            // Redirect based on payment method
            if (selectedPayment === 'esewa') {
                window.location.href = 'payment-esewa.html';
            } else if (selectedPayment === 'bank') {
                window.location.href = 'payment-bank.html';
            } else {
                window.location.href = 'payment.html';
            }
        }

        // ===== DEFAULT SELECT eSEWA =====
        document.addEventListener('DOMContentLoaded', () => {
            const defaultPayment = document.querySelector('.payment-option[data-method="esewa"]');
            if (defaultPayment) {
                defaultPayment.classList.add('selected');
                selectedPayment = 'esewa';
                selectedCharge = 10;
            }
            updateSummary();
        });
    </script>
</body>
</html>
