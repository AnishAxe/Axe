<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AXE · Netflix Premium</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        :root {
            --bg-void: #05010F;
            --bg-deep: #150A30;
            --card-dark: #170A38;
            --card-darker: #0E0524;
            --neon-purple: #A855F7;
            --accent-cyan: #22D3EE;
            --accent-blue: #3B82F6;
            --text-soft: #C9B8F0;
            --text-dim: #8A79B8;
            --danger-red: #E0224E;
            --success-green: #4ade80;
            --gold: #D4AF37;
            --glow-effect: 0 0 20px rgba(168, 85, 247, 0.5);
            --glow-cyan: 0 0 20px rgba(34, 211, 238, 0.45);
            --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            --shadow-sm: 0 4px 10px rgba(0, 0, 0, 0.5);
            --shadow-md: 0 8px 20px rgba(0, 0, 0, 0.6);
            --shadow-lg: 0 15px 30px rgba(0, 0, 0, 0.7);
            --border-radius: 16px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Montserrat', sans-serif;
            background: radial-gradient(circle at 20% 0%, var(--bg-deep), var(--bg-void) 60%);
            color: var(--text-soft);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 16px 40px;
            background-attachment: fixed;
        }

        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(ellipse at 30% 40%, rgba(34, 211, 238, 0.03) 0%, transparent 50%),
                        radial-gradient(ellipse at 70% 60%, rgba(124, 58, 237, 0.03) 0%, transparent 50%);
            z-index: 0;
            pointer-events: none;
        }

        .container {
            max-width: 960px;
            width: 100%;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        /* ===== HEADER ===== */
        .brand {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 12px 0 20px;
            border-bottom: 1px solid rgba(168, 85, 247, 0.4);
            margin-bottom: 28px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .brand-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .brand-avatar {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: var(--text-soft);
            border: 2px solid var(--neon-purple);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow: 0 0 16px rgba(168, 85, 247, 0.4);
            font-family: 'Cinzel', serif;
        }

        .brand-avatar img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        .brand-name {
            font-family: 'Cinzel', serif;
            font-weight: 700;
            font-size: 1.5rem;
            letter-spacing: 2px;
            background: linear-gradient(90deg, var(--neon-purple), var(--accent-cyan));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .brand-name small {
            display: block;
            font-size: 0.7rem;
            font-family: 'Montserrat', sans-serif;
            font-weight: 400;
            color: var(--text-dim);
            letter-spacing: 1px;
            margin-top: 2px;
        }

        /* ===== HAMBURGER MENU ===== */
        .menu-toggle {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 30px;
            height: 24px;
            cursor: pointer;
            transition: 0.3s;
            z-index: 110;
            position: relative;
        }
        .menu-toggle span {
            display: block;
            height: 3px;
            width: 100%;
            background: var(--accent-cyan);
            border-radius: 4px;
            transition: 0.3s;
            transform-origin: center;
        }
        .menu-toggle:hover span {
            background: var(--text-soft);
        }
        .menu-toggle.active span:nth-child(1) {
            transform: rotate(45deg) translate(5px, 5px);
        }
        .menu-toggle.active span:nth-child(2) {
            opacity: 0;
        }
        .menu-toggle.active span:nth-child(3) {
            transform: rotate(-45deg) translate(5px, -5px);
        }

        .dropdown-menu {
            position: fixed;
            top: 0;
            right: -100%;
            width: 280px;
            height: 100vh;
            background: rgba(14, 5, 36, 0.98);
            padding: 80px 30px 30px;
            transition: 0.3s ease;
            z-index: 105;
            box-shadow: var(--shadow-lg);
            backdrop-filter: blur(10px);
            border-left: 1px solid rgba(168, 85, 247, 0.4);
        }
        .dropdown-menu.active {
            right: 0;
        }
        .dropdown-menu a {
            display: block;
            color: var(--neon-purple);
            text-decoration: none;
            padding: 12px 15px;
            margin: 10px 0;
            border-radius: 8px;
            font-weight: 600;
            transition: 0.3s;
            background: rgba(168, 85, 247, 0.08);
            border-left: 3px solid transparent;
            font-family: 'Cinzel', serif;
            letter-spacing: 1px;
        }
        .dropdown-menu a:hover {
            background: rgba(34, 211, 238, 0.15);
            transform: translateX(-5px);
            border-left: 3px solid var(--accent-cyan);
            color: var(--accent-cyan);
        }

        /* ===== UID INPUT ===== */
        .uid-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 500px;
            margin: 0 auto 30px;
        }

        .uid-input {
            width: 100%;
            padding: 15px 25px;
            background: rgba(168, 85, 247, 0.08);
            border: 2px solid rgba(168, 85, 247, 0.2);
            border-radius: 30px;
            font-size: 1.1rem;
            color: var(--text-soft);
            text-align: center;
            outline: none;
            transition: all 0.3s ease;
            font-family: 'Cinzel', serif;
            letter-spacing: 1px;
        }

        .uid-input::placeholder {
            color: var(--text-dim);
            letter-spacing: 1px;
            font-size: 0.9rem;
        }

        .uid-input:focus {
            background: rgba(168, 85, 247, 0.15);
            border-color: var(--accent-cyan);
            box-shadow: 0 0 0 3px rgba(34, 211, 238, 0.15);
            transform: translateY(-2px);
        }

        /* ===== GRID ===== */
        .container-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            width: 100%;
            margin-bottom: 30px;
        }

        .box {
            padding: 18px 12px;
            background: linear-gradient(160deg, var(--card-dark), var(--card-darker));
            color: var(--neon-purple);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid rgba(168, 85, 247, 0.25);
            position: relative;
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-family: 'Cinzel', serif;
        }

        .box::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(to bottom right, transparent, transparent, transparent, rgba(168, 85, 247, 0.06));
            transform: rotate(30deg);
            transition: all 0.3s ease;
        }

        .box:hover {
            transform: translateY(-5px) scale(1.03);
            box-shadow: var(--glow-effect), var(--shadow-md);
            border-color: var(--accent-cyan);
            background: linear-gradient(160deg, rgba(23, 10, 56, 0.95), rgba(14, 5, 36, 0.98));
            color: var(--text-soft);
        }

        .box:hover::before {
            animation: shine 1.5s;
        }

        @keyframes shine {
            100% {
                left: 150%;
                top: 150%;
            }
        }

        .box.selected {
            border-color: var(--accent-cyan);
            background: linear-gradient(160deg, rgba(168, 85, 247, 0.2), rgba(34, 211, 238, 0.1));
            box-shadow: var(--glow-cyan), var(--shadow-md);
            transform: scale(1.02);
        }

        .box .package-icon {
            font-size: 1.5rem;
            display: block;
            text-shadow: 0 0 12px rgba(168, 85, 247, 0.4);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .box .package-name {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-soft);
            font-family: 'Cinzel', serif;
            letter-spacing: 0.5px;
        }

        .box .package-price {
            font-size: 1rem;
            font-weight: 700;
            color: var(--accent-cyan);
            background: rgba(34, 211, 238, 0.1);
            padding: 4px 14px;
            border-radius: 20px;
            border: 1px solid rgba(34, 211, 238, 0.15);
            font-family: 'Cinzel', serif;
            letter-spacing: 0.5px;
            margin-top: 2px;
        }

        .box .package-price small {
            font-size: 0.65rem;
            font-weight: 400;
            opacity: 0.6;
            margin-left: 2px;
            font-family: 'Montserrat', sans-serif;
        }

        /* ===== PAYMENT METHOD ===== */
        .payment-section {
            width: 100%;
            max-width: 600px;
            margin: 20px auto 25px;
            text-align: center;
        }

        .payment-title {
            font-family: 'Cinzel', serif;
            font-size: 1.1rem;
            color: var(--text-dim);
            letter-spacing: 2px;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .payment-options {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
        }

        .payment-option {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 24px;
            background: rgba(168, 85, 247, 0.08);
            border: 2px solid rgba(168, 85, 247, 0.2);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Cinzel', serif;
            font-size: 0.95rem;
            color: var(--text-soft);
            min-width: 140px;
            justify-content: center;
        }

        .payment-option:hover {
            background: rgba(168, 85, 247, 0.15);
            border-color: var(--accent-cyan);
            transform: translateY(-2px);
        }

        .payment-option.selected {
            border-color: var(--accent-cyan);
            background: rgba(34, 211, 238, 0.15);
            box-shadow: var(--glow-cyan);
        }

        .payment-option img {
            height: 32px;
            width: auto;
            object-fit: contain;
            border-radius: 4px;
        }

        .payment-option .option-label {
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        /* ===== NEXT BUTTON ===== */
        .next-button {
            padding: 15px 40px;
            background: linear-gradient(135deg, var(--neon-purple), var(--accent-blue));
            color: #fff;
            border: none;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(168, 85, 247, 0.35);
            position: relative;
            overflow: hidden;
            margin-top: 10px;
            letter-spacing: 1px;
            font-family: 'Cinzel', serif;
            border: 1px solid rgba(168, 85, 247, 0.3);
            display: inline-block;
        }

        .next-button:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: var(--glow-cyan);
            color: var(--text-soft);
            background: linear-gradient(135deg, var(--accent-cyan), var(--neon-purple));
        }

        .next-button::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(to bottom right, transparent, transparent, transparent, rgba(255, 255, 255, 0.15));
            transform: rotate(30deg);
            transition: all 0.3s ease;
        }

        .next-button:hover::after {
            animation: shine 1s;
        }

        .button-wrapper {
            text-align: center;
            width: 100%;
        }

        /* ===== ORNAMENTS ===== */
        .ornament {
            position: fixed;
            pointer-events: none;
            z-index: 0;
            opacity: 0.04;
            font-size: 100px;
            color: var(--neon-purple);
        }
        .ornament-1 { top: 50px; left: 50px; transform: rotate(15deg); }
        .ornament-2 { bottom: 50px; right: 50px; transform: rotate(-15deg); }

        /* ===== FOOTER ===== */
        .footer-note {
            margin-top: 30px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.75rem;
            color: var(--text-dim);
            letter-spacing: 1px;
            border-top: 1px solid rgba(168, 85, 247, 0.1);
            padding-top: 24px;
            text-align: center;
            width: 100%;
        }
        .footer-note strong {
            color: rgba(168, 85, 247, 0.4);
            font-weight: 600;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .container-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }
            .box {
                padding: 14px 10px;
            }
            .uid-wrapper {
                max-width: 100%;
            }
            .payment-options {
                gap: 15px;
            }
            .payment-option {
                padding: 10px 18px;
                min-width: 120px;
                font-size: 0.85rem;
            }
            .payment-option img {
                height: 26px;
            }
        }

        @media (max-width: 480px) {
            .container-grid {
                grid-template-columns: 1fr 1fr;
                gap: 10px;
            }
            .box {
                padding: 12px 8px;
            }
            .box .package-icon {
                font-size: 1.2rem;
            }
            .box .package-name {
                font-size: 0.75rem;
            }
            .box .package-price {
                font-size: 0.85rem;
                padding: 2px 10px;
            }
            .brand-name {
                font-size: 1.2rem;
            }
            .next-button {
                padding: 12px 30px;
                font-size: 1rem;
            }
            .payment-options {
                flex-direction: column;
                align-items: center;
                gap: 10px;
            }
            .payment-option {
                width: 100%;
                max-width: 250px;
            }
        }
    </style>
</head>
<body>
    <div class="ornament ornament-1">❖</div>
    <div class="ornament ornament-2">❖</div>

    <div class="container">

        <!-- ===== HEADER ===== -->
        <div class="brand">
            <div class="brand-left">
                <div class="brand-avatar">
                    <img src="logo.png" alt="AX Logo">
                </div>
                <div class="brand-name">
                    AXE
                    <small>Netflix Premium</small>
                </div>
            </div>
            <div class="menu-toggle" id="menuToggle">
                <span></span><span></span><span></span>
            </div>
        </div>

        <!-- ===== DROPDOWN MENU ===== -->
        <div class="dropdown-menu" id="dropdownMenu">
            <a href="index.html"><i class="fas fa-home"></i> Home</a>
            <a href="about.html"><i class="fas fa-scroll"></i> About Us</a>
            <a href="contact-info.html"><i class="fas fa-envelope"></i> Contact</a>
            <a href="history.html"><i class="fas fa-clock"></i> History</a>
        </div>

        <!-- ===== EMAIL INPUT ===== -->
        <div class="uid-wrapper">
            <input type="email" id="email" class="uid-input" placeholder="enter your whatsapp number" />
        </div>

        <!-- ===== PRICE LIST GRID ===== -->
        <div class="container-grid" id="packageGrid">
            <div class="box" data-package="1 Month SUBSCRIPTION 1 SCREEN - 420rs" data-price="420">
                <span class="package-icon">🎬</span>
                <span class="package-name">1 Month SUBSCRIPTION 1 SCREEN </span>
                <span class="package-price">₹420 <small>Rs</small></span>
            </div>
            <div class="box" data-package="1.5 Month SUBSCRIPTION 5 SCREEN - 3100rs" data-price="3100">
                <span class="package-icon">🎬</span>
                <span class="package-name">1.5 Month SUBSCRIPTION 5 SCREEN</span>
                <span class="package-price">₹3100 <small>Rs</small></span>
            </div>
          
        </div>

        <!-- ===== PAYMENT METHOD ===== -->
        <div class="payment-section">
            <div class="payment-title">Select Payment Method</div>
            <div class="payment-options">
                <div class="payment-option" data-method="esewa" onclick="selectPayment('esewa')">
                    <img src="esewa-logo.JPG" alt="eSewa">
                    <span class="option-label">eSewa</span>
                </div>
                <div class="payment-option" data-method="bank" onclick="selectPayment('bank')">
                    <img src="bank-logo.JPG" alt="Bank">
                    <span class="option-label">Bank</span>
                </div>
            </div>
        </div>

        <!-- ===== NEXT BUTTON ===== -->
        <div class="button-wrapper">
            <button class="next-button" onclick="goToPayment()">NEXT</button>
        </div>

        <!-- ===== FOOTER ===== -->
        <div class="footer-note">
            <strong>⚡ AXE GAMING SERVICES</strong> · Instant top-ups &amp; premium access
        </div>
    </div>

    <script>
        let selectedPackage = '';
        let selectedPrice = '';
        let selectedBox = null;
        let selectedPayment = '';

        // ===== MENU TOGGLE =====
        const menuToggle = document.getElementById('menuToggle');
        const dropdownMenu = document.getElementById('dropdownMenu');

        menuToggle.addEventListener('click', function(e) {
            e.stopPropagation();
            this.classList.toggle('active');
            dropdownMenu.classList.toggle('active');
        });

        document.addEventListener('click', function(event) {
            if (!event.target.closest('.menu-toggle') && !event.target.closest('.dropdown-menu')) {
                menuToggle.classList.remove('active');
                dropdownMenu.classList.remove('active');
            }
        });

        // ===== PACKAGE SELECTION =====
        const boxes = document.querySelectorAll('.box');
        boxes.forEach(box => {
            box.addEventListener('click', function() {
                if (selectedBox) {
                    selectedBox.classList.remove('selected');
                }
                this.classList.add('selected');
                selectedBox = this;
                selectedPackage = this.dataset.package;
                selectedPrice = this.dataset.price;
            });
        });

        // ===== PAYMENT SELECTION =====
        function selectPayment(method) {
            const options = document.querySelectorAll('.payment-option');
            options.forEach(opt => opt.classList.remove('selected'));
            
            const selected = document.querySelector(`.payment-option[data-method="${method}"]`);
            if (selected) {
                selected.classList.add('selected');
                selectedPayment = method;
            }
        }

        // ===== NEXT BUTTON =====
        function goToPayment() {
            const email = document.getElementById('email').value.trim();
            if (!email) {
                alert("Please enter your delivery email.");
                return;
            }
            if (!selectedPackage) {
                alert("Please select a package.");
                return;
            }
            if (!selectedPayment) {
                alert("Please select a payment method.");
                return;
            }

            localStorage.setItem('uid', email);
            localStorage.setItem('package', selectedPackage);
            localStorage.setItem('packagePrice', selectedPrice);
            localStorage.setItem('serviceType', 'Netflix Premium');
            localStorage.setItem('paymentMethod', selectedPayment);

            // Redirect based on payment method
            if (selectedPayment === 'esewa') {
                window.location.href = 'payment-esewa.html';
            } else if (selectedPayment === 'bank') {
                window.location.href = 'payment-bank.html';
            } else {
                window.location.href = 'payment.html';
            }
        }

        // ===== DEFAULT SELECT eSEWA =====
        document.addEventListener('DOMContentLoaded', function() {
            const defaultPayment = document.querySelector('.payment-option[data-method="esewa"]');
            if (defaultPayment) {
                defaultPayment.classList.add('selected');
                selectedPayment = 'esewa';
            }
        });

        // ===== FLOATING ICON ANIMATION =====
        const icons = document.querySelectorAll('.package-icon');
        icons.forEach((icon, index) => {
            setInterval(() => {
                icon.style.transform = `translateY(${Math.sin(Date.now() / 500 + index) * 5}px)`;
            }, 50);
        });
    </script>
</body>
</html>
